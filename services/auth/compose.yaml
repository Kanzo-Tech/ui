# The platform's identity service: Keycloak, its Postgres, and the realm as code. This file is the
# service as it runs anywhere; compose.dev.yaml adds what development wants on top.
#
#   docker compose --env-file dev/dev.env -f compose.yaml -f compose.dev.yaml up -d --wait
#
# brings up Keycloak on http://localhost:8080 with the platform's mappers (mappers/), the `kanzo`
# realm applied, the organizations and the conformance client declared in dev/, and seeded users
# and groups, with the development passwords of dev/dev.env. An application includes this
# file from its own compose (`include:`), mounts its declarations into `auth-realm` (an
# `x-application`, and an `x-organization` per organization: realm/declarations.tf), and puts
# Keycloak behind its own edge. Nothing here names an application.
#
# Service and volume names carry an `auth` prefix (or are `keycloak`) because an `include:` merges
# them into the including project, where a bare `postgres` would collide.
#
# The two passwords have no default: a deployment sets KC_DB_PASSWORD and KC_ADMIN_PASSWORD, and
# Compose refuses to start without them. A default here would be one deployment's password shipped
# as every deployment's (/docs/design/services).

name: kanzo-auth

services:
  auth-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD:?set KC_DB_PASSWORD, the identity database's password}
    volumes:
      - kanzo-auth-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  keycloak:
    # 26.8 is a floor: `addGroupRoleMappings` on the organization group mapper (26.7)
    # is what puts an application's roles inside each organization entry.
    image: quay.io/keycloak/keycloak:${KEYCLOAK_VERSION:-26.8.0}
    command: ["start"]
    # The platform's protocol mappers, built by auth-mappers below. `start` without `--optimized`
    # runs Keycloak's build step itself, which is what registers a provider jar — no custom image.
    volumes:
      - kanzo-auth-providers:/opt/keycloak/providers:ro
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://auth-postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:?set KC_DB_PASSWORD, the identity database's password}
      # The issuer every token names: the origin a browser reaches Keycloak at, behind an edge that
      # terminates TLS and says so in X-Forwarded-*. Callers inside the network (the realm, the
      # seed, a resource server fetching keys) reach http://keycloak:8080.
      KC_HOSTNAME: ${KC_HOSTNAME:-http://localhost:8080}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      # Keycloak reads these from the environment only; it has no *_FILE form for them.
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?set KC_ADMIN_PASSWORD, Keycloak's admin password}
    depends_on:
      auth-postgres:
        condition: service_healthy
      auth-mappers:
        condition: service_completed_successfully
    healthcheck:
      # The image carries no curl. Keycloak serves health on the management port
      # 9000, so this speaks HTTP/1.1 at it through bash's /dev/tcp.
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nhost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '\"status\": \"UP\"'",
        ]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 60s
    restart: unless-stopped

  # ── The platform's mappers ──────────────────────────────────────────────────
  # mappers/ is a provider jar — Keycloak's documented extension point, not a fork — holding the
  # mapper that writes each organization's group ids (`organization.<alias>.groups`). One-shot, on
  # every `up`: Maven builds it against the Keycloak version pinned in mappers/pom.xml, which must
  # be KEYCLOAK_VERSION, and puts it in the volume Keycloak loads providers from. The build copies
  # the sources out first, so a read-only checkout (or Compose's clone of a tag) builds the same.
  # Tests are CI's (the `services` job); `up` only packages.
  auth-mappers:
    image: maven:3.9-eclipse-temurin-21
    restart: "no"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        rm -rf /tmp/mappers && cp -r /mappers /tmp/mappers && cd /tmp/mappers
        mvn -B -q -DskipTests package
        rm -f /providers/*.jar && cp target/kanzo-keycloak-mappers.jar /providers/
    volumes:
      - ./mappers:/mappers:ro
      - kanzo-auth-providers:/providers
      - kanzo-auth-m2:/root/.m2

  # ── The realm, as code ──────────────────────────────────────────────────────
  # One-shot and idempotent, on every `up`. The state lives in a volume beside the database's, so
  # `down -v` forgets both together; a state that outlived its database would plan updates against
  # resources that no longer exist. Client secrets go to Keycloak write-only, never into state.
  #
  # TWO APPLIES, and the reason is structural. Keycloak creates the `organization` and `roles`
  # client scopes and their mappers itself, at realm creation, and those are the mappers this realm
  # changes (realm/token-claims.tf). Terraform adopts them with `import` blocks, whose ids must
  # resolve at PLAN time — impossible on an empty Keycloak. So: create the realm, then plan
  # against a Keycloak that has one.
  auth-realm:
    image: hashicorp/terraform:${TERRAFORM_VERSION:-1.14}
    restart: "no"
    working_dir: /auth/realm
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        terraform init -input=false -backend-config=path=/state/terraform.tfstate
        # Only a realm that is not there yet needs creating alone: one already in the state goes
        # straight to the full apply.
        terraform state list keycloak_realm.kanzo | grep -q . ||
          terraform apply -input=false -auto-approve -target=keycloak_realm.kanzo
        terraform apply -input=false -auto-approve
        terraform output
    volumes:
      - ./realm:/auth/realm
      - ./modules:/auth/modules:ro
      - kanzo-auth-tfstate:/state
    environment:
      TF_DATA_DIR: /state/.terraform
      TF_VAR_kc_url: http://keycloak:8080
      TF_VAR_kc_admin_username: ${KC_ADMIN_USERNAME:-admin}
      TF_VAR_kc_admin_password: ${KC_ADMIN_PASSWORD:?set KC_ADMIN_PASSWORD, Keycloak's admin password}
      TF_VAR_realm: ${KC_REALM:-kanzo}
      TF_VAR_issuer_base_url: ${KC_HOSTNAME:-http://localhost:8080}
    depends_on:
      keycloak:
        condition: service_healthy

  # ── The session's edge ──────────────────────────────────────────────────────
  # oauth2-proxy, an OIDC relying party in front of an application: it signs the person in with
  # PKCE, keeps the session in auth-valkey behind an opaque cookie, renews the tokens, signs out at
  # Keycloak, and hands the application the person (X-Forwarded-User, X-Forwarded-Email) and the
  # access token (X-Forwarded-Access-Token). The application keeps no secret and no session.
  #
  # Nothing here names an application. One application per Compose project extends this service
  # (as it extends auth-realm) with:
  #   environment  OAUTH2_PROXY_CLIENT_ID     its client (declarations.tf `client_id`)
  #                OAUTH2_PROXY_SCOPE         "openid email profile organization:* <its api>":
  #                                           `organization:*` puts every organization the person
  #                                           belongs to in the token (plain `organization` asks
  #                                           them to pick one), and the api's scope puts it in
  #                                           `aud`, so no exchange is needed
  #                OAUTH2_PROXY_UPSTREAMS     the application, as the proxy reaches it
  #                OAUTH2_PROXY_PROXY_PREFIX  where its callback lives (declarations.tf `callback`,
  #                                           minus `/callback`)
  #                OAUTH2_PROXY_WHITELIST_DOMAINS  its origins, for the redirect after sign-in
  #   secrets      auth-proxy-client (its client secret) and auth-proxy-cookie (16, 24 or 32 bytes),
  #                read as files: neither is ever in the environment
  #   ports        where the browser reaches it
  # The redirect URI is derived from the request's host, so one client serves every organization's
  # host. A sign-out elsewhere at Keycloak ends the session here when its access token next needs
  # renewing: within the realm's `access_token_lifespan` (realm.tf). /docs/design/auth.
  auth-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:${OAUTH2_PROXY_VERSION:-v7.15.5}
    environment:
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_PROVIDER: keycloak-oidc
      # The issuer every token names is the browser's origin for Keycloak (KC_HOSTNAME); the proxy
      # redeems, verifies and renews inside the network, so discovery, which would hand it the
      # browser's URLs, is skipped and the endpoints are named.
      OAUTH2_PROXY_OIDC_ISSUER_URL: ${KC_HOSTNAME:-http://localhost:8080}/realms/${KC_REALM:-kanzo}
      OAUTH2_PROXY_SKIP_OIDC_DISCOVERY: "true"
      OAUTH2_PROXY_LOGIN_URL: ${KC_HOSTNAME:-http://localhost:8080}/realms/${KC_REALM:-kanzo}/protocol/openid-connect/auth
      OAUTH2_PROXY_REDEEM_URL: http://keycloak:8080/realms/${KC_REALM:-kanzo}/protocol/openid-connect/token
      OAUTH2_PROXY_OIDC_JWKS_URL: http://keycloak:8080/realms/${KC_REALM:-kanzo}/protocol/openid-connect/certs
      OAUTH2_PROXY_VALIDATE_URL: http://keycloak:8080/realms/${KC_REALM:-kanzo}/protocol/openid-connect/userinfo
      OAUTH2_PROXY_BACKEND_LOGOUT_URL: http://keycloak:8080/realms/${KC_REALM:-kanzo}/protocol/openid-connect/logout?id_token_hint={id_token}
      OAUTH2_PROXY_CODE_CHALLENGE_METHOD: S256
      OAUTH2_PROXY_CLIENT_SECRET_FILE: /run/secrets/auth-proxy-client
      OAUTH2_PROXY_COOKIE_SECRET_FILE: /run/secrets/auth-proxy-cookie
      # A deployment is served over HTTPS behind its edge: the cookie is host-only and Secure.
      OAUTH2_PROXY_COOKIE_NAME: __Host-session
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_COOKIE_SAMESITE: lax
      OAUTH2_PROXY_COOKIE_REFRESH: 1m
      OAUTH2_PROXY_SESSION_STORE_TYPE: redis
      OAUTH2_PROXY_REDIS_CONNECTION_URL: redis://auth-valkey:6379
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      OAUTH2_PROXY_PASS_ACCESS_TOKEN: "true"
      # Behind the deployment's edge, which terminates TLS and says so in X-Forwarded-*.
      OAUTH2_PROXY_REVERSE_PROXY: "true"
    depends_on:
      auth-valkey:
        condition: service_healthy
    restart: unless-stopped

  # The sessions auth-proxy keeps. In memory: a restart signs everyone in again, which Keycloak's
  # own session makes a redirect, not a form.
  auth-valkey:
    image: valkey/valkey:${VALKEY_VERSION:-8.1-alpine}
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  kanzo-auth-db:
  kanzo-auth-tfstate:
  kanzo-auth-providers:
  kanzo-auth-m2:
