# The platform's identity service: Keycloak with its realm as code.
#
#   docker compose up -d --wait
#
# brings up Keycloak on http://localhost:8080 with the `kanzo` realm applied, two
# organizations, the conformance client, and seeded users and groups. An application
# includes this file from its own compose (`include:`) and registers its client
# with modules/app; nothing here names an application.
#
# Service and volume names carry an `auth` prefix (or are `keycloak`) because an
# `include:` merges them into the including project, where a bare `postgres` would
# collide. Admin console: http://localhost:8080/admin (admin/admin).

name: kanzo-auth

services:
  auth-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD:-keycloak}
    volumes:
      - kanzo-auth-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    # 26.8 is a floor: `addGroupRoleMappings` on the organization group mapper (26.7)
    # is what puts an application's roles inside each organization entry.
    image: quay.io/keycloak/keycloak:${KEYCLOAK_VERSION:-26.8.0}
    command: ["start-dev"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://auth-postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:-keycloak}
      # The issuer a browser sees, on the port it is published at. Backchannel
      # callers (terraform, seed) reach http://keycloak:8080; the admin API does
      # not care which.
      KC_HOSTNAME: http://localhost:${KC_PORT:-8080}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-admin}
    ports:
      - "${KC_PORT:-8080}:8080"
    depends_on:
      auth-postgres:
        condition: service_healthy
    healthcheck:
      # The image carries no curl. Keycloak serves health on the management port
      # 9000, so this speaks HTTP/1.1 at it through bash's /dev/tcp.
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nhost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '\"status\": \"UP\"'",
        ]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  # ── The realm, as code ──────────────────────────────────────────────────────
  # One-shot and idempotent. The state lives in a volume beside the database's, so
  # `down -v` forgets both together; a state that outlived its database would plan
  # updates against resources that no longer exist.
  #
  # TWO APPLIES, and the reason is structural. Keycloak creates the `organization`
  # and `roles` client scopes and their mappers itself, at realm creation, and those
  # are the mappers this realm changes (realm/token-claims.tf). Terraform adopts them
  # with `import` blocks, whose ids must resolve at PLAN time — impossible on an
  # empty Keycloak. So: create the realm, then plan against a Keycloak that has one.
  auth-realm:
    image: hashicorp/terraform:${TERRAFORM_VERSION:-1.14}
    restart: "no"
    working_dir: /auth/realm
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        terraform init -input=false -backend-config=path=/state/terraform.tfstate
        set -- -input=false -auto-approve -var-file=dev.tfvars \
          -var kc_admin_username="$$KC_ADMIN_USERNAME" -var kc_admin_password="$$KC_ADMIN_PASSWORD"
        terraform apply "$$@" -target=keycloak_realm.kanzo
        terraform apply "$$@"
        terraform output
    volumes:
      - ./realm:/auth/realm
      - ./modules:/auth/modules:ro
      - kanzo-auth-tfstate:/state
    environment:
      TF_DATA_DIR: /state/.terraform
      KC_ADMIN_USERNAME: ${KC_ADMIN_USERNAME:-admin}
      KC_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-admin}
    depends_on:
      keycloak:
        condition: service_healthy

  # ── Local members ───────────────────────────────────────────────────────────
  # Membership is runtime in Keycloak's model and has no Terraform resource. In
  # development it is a script; in production it is an invitation.
  auth-seed:
    image: alpine:3.22
    restart: "no"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        apk add --no-cache --quiet curl jq >/dev/null
        exec /seed/seed.sh
    volumes:
      - ./seed:/seed:ro
    environment:
      KC_URL: http://keycloak:8080
      KC_REALM: ${KC_REALM:-kanzo}
      KC_ADMIN_USERNAME: ${KC_ADMIN_USERNAME:-admin}
      KC_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-admin}
    depends_on:
      auth-realm:
        condition: service_completed_successfully

volumes:
  kanzo-auth-db:
  kanzo-auth-tfstate:
