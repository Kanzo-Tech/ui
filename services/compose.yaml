# The platform's services as a deployment runs them: identity, nothing of
# development. An application includes this from its production overlay, by URL at its release:
#
#   include:
#     - https://github.com/Kanzo-Tech/ui.git#v0.35.0:services/compose.yaml
#
# and supplies the values as environment: KC_HOSTNAME, and KC_DB_PASSWORD and KC_ADMIN_PASSWORD,
# which have no default and without which Compose refuses to start.
name: kanzo

include:
  - auth/compose.yaml
