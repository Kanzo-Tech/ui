# The platform's AI gateway: agentgateway, the one door to models as Keycloak is the one door to
# identity. Applications speak OpenAI chat completions to it through their own server, with an
# access token the realm issued for this gateway, and name an alias (`chat`, `complete`), never a
# provider.
#
#   docker compose -f ../auth/compose.yml -f compose.yml up -d --wait
#
# brings the gateway up on http://localhost:4000 beside the identity service it trusts, with both
# aliases served by Docker Model Runner on the host's GPU (Docker Desktop 4.40+, Model Runner on).
# The first `up` pulls the models (~6.5 GB). An application includes both files (`include:`).

name: kanzo-ai

services:
  # The request log: who asked, for which organization, the alias, the tokens and their cost.
  ai-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: gateway
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway
    volumes:
      - kanzo-ai-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway"]
      interval: 5s
      timeout: 5s
      retries: 20

  ai-gateway:
    # Pinned by digest, and moved deliberately: the gateway holds every provider's key.
    image: ghcr.io/agentgateway/agentgateway:v1.6.0@sha256:9d3e6044ddcdc0878b1787f77bd401252b95e22684203fb5e874c4c42d2ed90c
    command: ["-f", "/config/gateway.yaml"]
    ports:
      - "${AI_PORT:-4000}:4000"
    volumes:
      - ./gateway.yaml:/config/gateway.yaml:ro
    environment:
      AI_DATABASE_URL: postgresql://gateway:gateway@ai-postgres:5432/gateway
      # The issuer the tokens say, which is the one a browser sees; the keys are fetched from
      # inside the network. The gateway exits while they cannot be fetched, and restarts.
      AI_ISSUER: ${AI_ISSUER:-http://localhost:8080/realms/kanzo}
      AI_JWKS_URL: ${AI_JWKS_URL:-http://keycloak:8080/realms/kanzo/protocol/openid-connect/certs}
      AI_AUDIENCE: ${AI_AUDIENCE:-ai-gateway}
    restart: on-failure
    models:
      chat:
        endpoint_var: CHAT_URL
        model_var: CHAT_MODEL
      complete:
        endpoint_var: COMPLETE_URL
        model_var: COMPLETE_MODEL
    depends_on:
      ai-postgres:
        condition: service_healthy

models:
  chat:
    model: hf.co/NousResearch/Hermes-3-Llama-3.1-8B-GGUF:Q4_K_M
  complete:
    model: hf.co/NousResearch/Hermes-3-Llama-3.2-3B-GGUF:Q4_K_M

volumes:
  kanzo-ai-db:
