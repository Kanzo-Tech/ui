# Development, on top of compose.yaml: the gateway on the host's :4000, both aliases on open models
# by default, and — with the `local-models` profile — those models pulled into Docker Model Runner
# on the host's GPU (~6.5 GB, once). `AI_CHAT=anthropic/…` and its key in the environment answer an
# alias from a provider instead; with neither alias local, the profile is not needed.
#
# A context of 8192 tokens is what makes them fit a 16 GB laptop: the bundles declare 131072, and
# llama.cpp reserves the cache for all of it when it loads a model (~16 GB for the 8B alone).
services:
  ai-gateway:
    ports:
      - "${AI_PORT:-4000}:4000"
    environment:
      AI_ISSUER: http://localhost:${KC_PORT:-8080}/realms/${KC_REALM:-kanzo}
      AI_CHAT: ${AI_CHAT:-local/hf.co/NousResearch/Hermes-3-Llama-3.1-8B-GGUF:Q4_K_M}
      AI_COMPLETE: ${AI_COMPLETE:-local/hf.co/NousResearch/Hermes-3-Llama-3.2-3B-GGUF:Q4_K_M}
    depends_on:
      ai-models:
        condition: service_completed_successfully
        required: false

  # Holds the models, so they are pulled and configured only when the profile is on; the gateway
  # reaches Docker Model Runner by itself (LOCAL_MODELS_URL).
  ai-models:
    profiles: [local-models]
    image: alpine:3.22
    command: ["true"]
    models:
      - chat
      - complete

models:
  chat:
    model: hf.co/NousResearch/Hermes-3-Llama-3.1-8B-GGUF:Q4_K_M
    context_size: 8192
  complete:
    model: hf.co/NousResearch/Hermes-3-Llama-3.2-3B-GGUF:Q4_K_M
    context_size: 8192
