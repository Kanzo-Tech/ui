# The platform's services as development runs them: each service with its development overlay —
# Keycloak on :8080 with the dev/ declarations and seeded people.
#
#   docker compose -f compose.dev.yaml up -d --wait
#
# An application includes this from its development overlay, by URL at its release, in place of
# compose.yaml.
name: kanzo

include:
  - path: [auth/compose.yaml, auth/compose.dev.yaml]
