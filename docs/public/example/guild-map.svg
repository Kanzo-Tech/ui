<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-label="A surveyor's map of the Guild's six regions">
  <title>The Guild's territory, as the Amber Hall's surveyors drew it</title>
  <defs>
    <radialGradient id="vignette" cx="50%" cy="45%" r="72%">
      <stop offset="60%" stop-color="#efe4c8" stop-opacity="0"/>
      <stop offset="100%" stop-color="#8a7448" stop-opacity="0.45"/>
    </radialGradient>
    <pattern id="marsh" width="26" height="26" patternUnits="userSpaceOnUse" patternTransform="rotate(20)">
      <path d="M0 13h26" stroke="#4b6152" stroke-width="2" stroke-opacity="0.35"/>
    </pattern>
    <pattern id="ash" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="1.8" fill="#6a5a52" fill-opacity="0.45"/>
      <circle cx="15" cy="16" r="1.2" fill="#6a5a52" fill-opacity="0.35"/>
    </pattern>
    <g id="conifer">
      <path d="M0 0 L-9 20 L9 20 Z" fill="#4f6b4a" fill-opacity="0.75"/>
      <path d="M0 -12 L-7 6 L7 6 Z" fill="#5c7a55" fill-opacity="0.8"/>
    </g>
    <g id="peak">
      <path d="M0 0 L-26 34 L26 34 Z" fill="#8c8478" fill-opacity="0.85" stroke="#5d564d" stroke-width="2"/>
      <path d="M0 0 L-10 13 L0 9 L10 13 Z" fill="#f0ece2"/>
    </g>
  </defs>

  <rect width="1600" height="1200" fill="#e9dcbc"/>

  <!-- the sea, east -->
  <path d="M1298 0 C1330 130 1268 250 1300 372 C1332 494 1256 596 1290 716 C1324 836 1258 950 1292 1080 C1310 1146 1330 1176 1348 1200 L1600 1200 L1600 0 Z" fill="#9fbec4"/>
  <g stroke="#7ea3ab" stroke-width="3" fill="none" stroke-opacity="0.8">
    <path d="M1360 160 q22 -16 44 0 t44 0"/>
    <path d="M1420 320 q22 -16 44 0 t44 0"/>
    <path d="M1352 520 q22 -16 44 0 t44 0"/>
    <path d="M1438 700 q22 -16 44 0 t44 0"/>
    <path d="M1360 900 q22 -16 44 0 t44 0"/>
    <path d="M1440 1060 q22 -16 44 0 t44 0"/>
  </g>

  <!-- Thornmarch, north-west -->
  <path d="M120 96 C300 60 470 78 596 130 C650 236 626 358 560 452 C420 500 268 486 168 424 C112 322 100 200 120 96 Z" fill="#cdd2a6" stroke="#6d6a4c" stroke-width="3"/>
  <!-- Coldiron, north-east -->
  <path d="M614 128 C760 74 950 76 1104 122 C1176 208 1188 320 1150 424 C1000 470 820 468 676 434 C614 340 596 226 614 128 Z" fill="#d5cfc2" stroke="#6d6a4c" stroke-width="3"/>
  <!-- Saltmere, the coast -->
  <path d="M1160 430 C1240 404 1272 440 1284 520 C1296 618 1258 700 1196 742 C1120 742 1074 700 1056 620 C1058 528 1096 458 1160 430 Z" fill="#bcd0c4" stroke="#6d6a4c" stroke-width="3"/>
  <!-- Greenhollow, the middle -->
  <path d="M472 486 C640 442 828 452 966 496 C1010 610 986 736 906 820 C740 866 570 858 452 800 C412 700 424 578 472 486 Z" fill="#b9cc9a" stroke="#6d6a4c" stroke-width="3"/>
  <!-- Duskfen, south-west -->
  <path d="M148 470 C280 486 396 500 438 560 C452 690 440 820 396 940 C300 1010 200 1012 128 950 C104 810 108 620 148 470 Z" fill="#a9b7a6" stroke="#6d6a4c" stroke-width="3"/>
  <path d="M148 470 C280 486 396 500 438 560 C452 690 440 820 396 940 C300 1010 200 1012 128 950 C104 810 108 620 148 470 Z" fill="url(#marsh)" opacity="0.6"/>
  <!-- Ashfall Reach, south-east -->
  <path d="M930 838 C1060 800 1180 812 1252 866 C1268 962 1236 1064 1170 1128 C1040 1152 918 1130 856 1064 C846 964 872 886 930 838 Z" fill="#c9bcae" stroke="#6d6a4c" stroke-width="3"/>
  <path d="M930 838 C1060 800 1180 812 1252 866 C1268 962 1236 1064 1170 1128 C1040 1152 918 1130 856 1064 C846 964 872 886 930 838 Z" fill="url(#ash)" opacity="0.75"/>

  <!-- the river, out of Coldiron and into the sea -->
  <path d="M880 200 C860 320 806 400 760 470 C712 546 700 640 726 712 C756 792 838 830 940 842 C1050 856 1140 812 1214 760" fill="none" stroke="#8fb2bd" stroke-width="11" stroke-linecap="round"/>
  <path d="M880 200 C860 320 806 400 760 470 C712 546 700 640 726 712 C756 792 838 830 940 842 C1050 856 1140 812 1214 760" fill="none" stroke="#c3dbe2" stroke-width="4" stroke-linecap="round"/>

  <!-- the mountains of Coldiron -->
  <g>
    <use href="#peak" x="740" y="180"/>
    <use href="#peak" x="812" y="200"/>
    <use href="#peak" x="884" y="172"/>
    <use href="#peak" x="960" y="204"/>
    <use href="#peak" x="1032" y="186"/>
    <use href="#peak" x="776" y="256"/>
    <use href="#peak" x="920" y="256"/>
    <use href="#peak" x="1000" y="268"/>
  </g>

  <!-- the wood of Thornmarch, and the hollow's orchards -->
  <g>
    <use href="#conifer" x="220" y="180"/>
    <use href="#conifer" x="268" y="228"/>
    <use href="#conifer" x="188" y="264"/>
    <use href="#conifer" x="320" y="180"/>
    <use href="#conifer" x="366" y="240"/>
    <use href="#conifer" x="252" y="326"/>
    <use href="#conifer" x="356" y="352"/>
    <use href="#conifer" x="452" y="216"/>
    <use href="#conifer" x="486" y="298"/>
    <use href="#conifer" x="420" y="392"/>
  </g>
  <g opacity="0.85">
    <use href="#conifer" x="560" y="600"/>
    <use href="#conifer" x="612" y="656"/>
    <use href="#conifer" x="672" y="596"/>
    <use href="#conifer" x="840" y="628"/>
    <use href="#conifer" x="896" y="690"/>
  </g>

  <!-- roads -->
  <g stroke="#8a7448" stroke-width="4" stroke-dasharray="14 12" fill="none" stroke-opacity="0.8">
    <path d="M300 300 C480 380 560 520 660 620 C760 716 940 740 1120 660"/>
    <path d="M660 620 C620 760 520 860 320 900"/>
    <path d="M940 842 C1000 900 1020 990 1010 1060"/>
  </g>

  <!-- the halls -->
  <g fill="#8a3324" stroke="#4d1d14" stroke-width="2">
    <circle cx="300" cy="300" r="11"/>
    <circle cx="660" cy="620" r="13"/>
    <circle cx="1120" cy="660" r="11"/>
    <circle cx="320" cy="900" r="11"/>
    <circle cx="1010" cy="1060" r="11"/>
  </g>
  <g font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#3f3a2e">
    <text x="322" y="296">Ironwake</text>
    <text x="684" y="616">Amber Hall</text>
    <text x="1000" y="700" text-anchor="end">Saltmere Quay</text>
    <text x="342" y="896">Fenwatch</text>
    <text x="1032" y="1056">Cinderpost</text>
  </g>

  <!-- the regions, named -->
  <g font-family="Georgia, 'Times New Roman', serif" font-size="44" fill="#4a4232" letter-spacing="6" opacity="0.9">
    <text x="356" y="150" text-anchor="middle">THORNMARCH</text>
    <text x="860" y="392" text-anchor="middle">COLDIRON</text>
    <text x="1170" y="576" text-anchor="middle" font-size="34">SALTMERE</text>
    <text x="712" y="778" text-anchor="middle">GREENHOLLOW</text>
    <text x="268" y="700" text-anchor="middle" font-size="38">DUSKFEN</text>
    <text x="1060" y="960" text-anchor="middle" font-size="34">ASHFALL REACH</text>
  </g>

  <!-- the compass rose -->
  <g transform="translate(1420 220)">
    <circle r="86" fill="#e9dcbc" fill-opacity="0.85" stroke="#6d6a4c" stroke-width="3"/>
    <circle r="62" fill="none" stroke="#6d6a4c" stroke-width="1.5" stroke-opacity="0.7"/>
    <path d="M0 -74 L16 0 L0 74 L-16 0 Z" fill="#3f3a2e"/>
    <path d="M-74 0 L0 -16 L74 0 L0 16 Z" fill="#8a7448" fill-opacity="0.85"/>
    <path d="M0 -74 L16 0 L0 0 Z" fill="#8a3324"/>
    <text x="0" y="-92" text-anchor="middle" font-family="Georgia, serif" font-size="26" fill="#3f3a2e">N</text>
  </g>

  <!-- the scale -->
  <g transform="translate(120 1090)">
    <rect x="0" y="0" width="80" height="14" fill="#3f3a2e"/>
    <rect x="80" y="0" width="80" height="14" fill="#e9dcbc" stroke="#3f3a2e" stroke-width="2"/>
    <rect x="160" y="0" width="80" height="14" fill="#3f3a2e"/>
    <text x="0" y="44" font-family="Georgia, serif" font-size="24" fill="#3f3a2e">0</text>
    <text x="240" y="44" font-family="Georgia, serif" font-size="24" fill="#3f3a2e" text-anchor="middle">30 leagues</text>
  </g>

  <rect width="1600" height="1200" fill="url(#vignette)"/>
  <rect x="18" y="18" width="1564" height="1164" fill="none" stroke="#6d6a4c" stroke-width="6" stroke-opacity="0.55"/>
</svg>
