name: CI

on:
  push:
    branches: [main]
  pull_request:

# A branch only needs its newest commit checked. Cancelling the run under it saves
# a full gate — several minutes of runner — every time someone pushes twice.
# `github.ref` keeps main and each PR in their own group.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      # The gate lives in `pnpm verify`, not here. The publish workflow runs the
      # same script, which is the only way the two stay identical — when the list
      # was written out in both files they drifted, and the release path was the
      # one missing checks.
      - run: pnpm verify

  # The harnesses in a browser: `@kanzo-tech/testing`'s end-to-end suite drives the docs' workspace
  # showcase in Chromium, through the same harnesses a host's suite uses. It needs what `verify` does
  # not run — a corpus written by fossil's executor, a `next start` to talk to, and a browser — so it
  # is a job of its own. WebGL is SwiftShader's, Chromium's software renderer: a runner has no GPU.
  harnesses:
    name: harnesses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm build
      - run: pnpm --filter @kanzo-tech/docs corpus
      - name: Chromium
        run: pnpm --filter @kanzo-tech/testing exec playwright-core install --with-deps chromium-headless-shell
      - name: Serve the docs
        run: |
          pnpm --filter @kanzo-tech/docs start > "$RUNNER_TEMP/next.log" 2>&1 &
          for _ in $(seq 60); do curl -sf http://localhost:3100/view/showcases/workspace > /dev/null && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/next.log"; exit 1
      - run: pnpm --filter @kanzo-tech/testing test:e2e
        env:
          KANZO_DOCS_URL: http://localhost:3100

  # The server halves. A realm that applies but puts the roles somewhere else is worth
  # nothing, so the auth job proves the claim contract on a live token — the same
  # script a developer runs — rather than validating the Terraform alone.
  services:
    name: services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Format
        run: terraform fmt -recursive -check services
      - name: Validate the modules
        run: |
          for m in services/auth/modules/app services/auth/modules/api services/ai/modules/gateway; do
            export TF_DATA_DIR="$RUNNER_TEMP/tf-$(basename "$m")"
            terraform -chdir="$m" init -backend=false -input=false >/dev/null
            terraform -chdir="$m" validate
          done
      - name: Bring up the identity service
        working-directory: services/auth
        run: docker compose up -d --wait keycloak && docker compose up --exit-code-from auth-seed auth-seed
      - name: The claim contract, on live tokens
        working-directory: services/auth
        run: for u in ana bruno eva fede carla dan; do scripts/verify.sh "$u" > "$RUNNER_TEMP/$u.log" || { cat "$RUNNER_TEMP/$u.log"; exit 1; }; done
      - name: The gateway's config, against the live realm
        run: |
          image=$(sed -n 's/^ *image: \(ghcr\.io\/agentgateway\/[^ ]*\)$/\1/p' services/ai/compose.yml)
          docker run --rm --network host -v "$PWD/services/ai/gateway.yaml:/config/gateway.yaml:ro" \
            -e AI_DATABASE_URL=/tmp/requests.sqlite \
            -e AI_ISSUER=http://localhost:8080/realms/kanzo \
            -e AI_JWKS_URL=http://localhost:8080/realms/kanzo/protocol/openid-connect/certs \
            -e AI_AUDIENCE=ai-gateway \
            -e CHAT_URL=http://localhost:12434/engines/v1 -e CHAT_MODEL=chat \
            -e COMPLETE_URL=http://localhost:12434/engines/v1 -e COMPLETE_MODEL=complete \
            "$image" --validate-only -f /config/gateway.yaml
      - name: Keycloak's log, on failure
        if: failure()
        working-directory: services/auth
        run: docker compose logs keycloak auth-realm auth-seed
