name: Release

# Publishes every @kanzo-tech package when a GitHub Release is published.
# Same shape as rudof's publish.yml: the release is the decision, made by a person,
# and this workflow is only what carries it out. No version PR, nothing to merge.
# It keeps the name `release.yml` rather than rudof's `publish.yml` for two
# reasons: there is no second workflow here to distinguish it from — rudof's
# release.yml bumps and tags, which is the part done by hand here — and npm ties a
# package's trusted publisher to a workflow FILENAME, so renaming this file
# silently invalidates the OIDC configuration of every package pointing at it.
#
# EVERY PACKAGE, ONE VERSION, ONE RELEASE — a constraint, not a preference.
# `packages/ui` depends on `@kanzo-tech/theme` and `@kanzo-tech/mosaic` through
# `workspace:*`, which pnpm rewrites to their exact versions at pack time: a ui
# published without them names a version the registry does not have, so
# `npm install` fails outright. `graph` and `ai` peer-depend on `ui` and carry the coupling one
# step further out.
#
# `@kanzo-tech/auth` names none of them and is the one package that could move on
# its own. It moves with the rest anyway, because the alternative is two cadences
# to reason about and a second release path to keep correct — and the count is
# deliberately not written down here any more. It was, and it went stale the day a
# package was added; the stamp below derives it instead.
#
# The release tag carries the version: `v0.1.0`, or `v0.2.0-rc.1`, whose
# prerelease identifier becomes the dist-tag so `latest` stays where it was.
#
# AUTH. OIDC only. Every @kanzo-tech package has a Trusted Publisher configured
# on npmjs.com pointing at this file, so the publish step carries no token and
# every tarball it ships is signed.
#
# A NEW PACKAGE cannot ship that way the first time. A trusted publisher is
# configured per package, and a package exists only once it has been published,
# so its first publish can never be the OIDC one — and `pnpm publish -r` aborts on
# the first package the registry refuses, which takes the whole release down
# however well the others went. So a package added under packages/ needs, in
# this order:
#   1. one token publish: create an npm automation token as the repo secret
#      NPM_TOKEN and give the Publish step
#        env:
#          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
#      for that one release. Packages that already have a publisher still go
#      through OIDC beside it.
#   2. its trusted publisher: npmjs.com → package → Settings → GitHub Actions,
#      owner Kanzo-Tech, repo ui, workflow release.yml.
#   3. then delete the `env:` block and the secret again. A token that publishes
#      is not a publisher that is configured, and a token left here is how the
#      next package would ship unsigned without anyone deciding it should.
#
# Provenance is not decoration: npm verifies the signed statement against the
# manifest and REJECTS the publish with a 422 when `repository.url` does not match
# the building repo. No local lint catches that — publint passes a package with no
# `repository` at all — it is enforced at the registry. Every package declares it.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Dry run: run the gate and pack, without publishing"
        type: boolean
        default: true

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  publish:
    name: Publish @kanzo-tech/*
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # OIDC token for npm Trusted Publishing, and what signs the provenance.
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          # Only here: the registry the OIDC exchange and the publish address.
          registry-url: "https://registry.npmjs.org"
      # npm >= 11.5.1 for Trusted Publishing.
      - name: Upgrade npm
        run: npm install -g npm@latest

      # On a release the tag is the version. On a manual dispatch there is no tag,
      # so the committed version stands in — which is only ever useful for a dry
      # run, and that is what the input defaults to.
      - name: Resolve version and dist-tag
        id: ver
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "release" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(node -p "require('./packages/ui/package.json').version")"
          fi
          case "$version" in
            *-*) tag="${version#*-}"; tag="${tag%%.*}" ;;
            *)   tag="latest" ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "$version → dist-tag $tag"

      # The committed versions are placeholders; the release is the statement.
      #
      # DERIVED, not listed. This loop named four packages by hand and was correct
      # the day it was written; `@kanzo-tech/mosaic` was extracted later and nobody
      # added it, so it sat published at 0.1.0 while the others moved — and since
      # `ui` depends on it through `workspace:*`, which pnpm rewrites to an exact
      # version at pack time, the next release would have shipped a `ui` pinned to
      # a frozen mosaic and then failed outright republishing 0.1.0. Exactly the
      # failure the header calls a constraint, reached by the one route the header
      # did not cover: a package added after it.
      #
      # So the roster is whatever `packages/*` holds that is not private, which is
      # the same answer `pnpm -r --filter "./packages/*" publish` gives itself two
      # steps below. One source, so they cannot drift.
      - name: Stamp the version on every publishable package
        run: |
          set -euo pipefail
          stamped=0
          for manifest in packages/*/package.json; do
            # An unmatched glob is the literal pattern in bash. Without this the
            # failure would be a `require` stack trace, which reads like a broken
            # manifest rather than an empty roster.
            [ -e "$manifest" ] || continue
            if [ "$(node -p "require('./$manifest').private === true")" = "true" ]; then
              echo "  skipped $(dirname "$manifest") — private"
              continue
            fi
            (cd "$(dirname "$manifest")" && npm pkg set version="${{ steps.ver.outputs.version }}")
            echo "  $(node -p "require('./$manifest').name")@${{ steps.ver.outputs.version }}"
            stamped=$((stamped + 1))
          done
          # A roster that silently resolved to nothing would sail through every step
          # below and publish the versions already committed.
          if [ "$stamped" -eq 0 ]; then
            echo "no publishable package found under packages/ — the derivation is broken" >&2
            exit 1
          fi
          echo "stamped $stamped package(s) at ${{ steps.ver.outputs.version }}"

      # The same `pnpm verify` CI runs — one definition, so the release gate can
      # never be the weaker of the two again. It runs AFTER the stamp, so what is
      # checked is what ships. npm versions are immutable after 72 hours; a red
      # build must not reach the registry.
      - run: pnpm verify

      # `pnpm publish`, never `npm publish`: only pnpm rewrites `workspace:*` into
      # a real range, and -r publishes in dependency order so theme precedes ui.
      # --no-git-checks because the stamp above leaves the tree dirty by design.
      - name: Publish
        if: ${{ github.event_name == 'release' || !inputs.dry-run }}
        # TEMPORARY — @kanzo-tech/llm's first publish (see A NEW PACKAGE above).
        # Delete this env block, and the NPM_TOKEN secret, once its trusted publisher is set.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          pnpm -r --filter "./packages/*" publish \
            --access public --tag "${{ steps.ver.outputs.tag }}" --no-git-checks

      - name: Dry run — pack only
        if: ${{ github.event_name != 'release' && inputs.dry-run }}
        run: |
          pnpm -r --filter "./packages/*" publish \
            --access public --tag "${{ steps.ver.outputs.tag }}" --no-git-checks --dry-run
