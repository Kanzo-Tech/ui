name: Release (npm)

# Publishes all four @kanzo-tech packages from a tag. `v0.1.0` publishes 0.1.0;
# `v0.2.0-alpha.1` publishes that under the `alpha` dist-tag. One workflow covers
# releases and prereleases, because the only difference is which tag npm moves.
#
# FOUR PACKAGES, ONE VERSION, ONE TAG — and this is a constraint, not a style.
# `packages/ui` depends on `@kanzo-tech/theme` through `workspace:*`, which pnpm
# rewrites to theme's exact version at pack time: publish ui without theme and the
# tarball names a version that is not on the registry, so `npm install` fails
# outright (check 1 of `scripts/smoke-install.mjs` is that exact failure).
# `graph` and `ai` peer-depend on `ui` and carry the same coupling one step out.
#
# WHY NOT `changesets/action`. Two reasons, both found the hard way:
#   · it publishes by opening a version PR, and this org does not permit Actions
#     to create pull requests — the run reaches the last step and dies there;
#   · changesets bumps a package whose PEER dependency took a minor to MAJOR, by
#     design. The first release therefore proposed ui and theme at 0.1.0 and graph
#     and ai at 1.0.0, promising v1 stability for the two youngest packages.
# The tag is a plainer statement of the same intent. Changesets stays for what it
# is good at — `pnpm changeset` and `pnpm version-packages` still author the
# CHANGELOGs; they just no longer decide what ships.
#
# AUTH. NPM_TOKEN, because a trusted publisher is configured per package and a
# package exists only once published — so a package's FIRST publish can never be
# the OIDC one. @kanzo-tech/theme and @kanzo-tech/ui exist as of 0.0.1-alpha;
# graph and ai do not, and this workflow is what creates them. Once all four are
# on the registry, configure a Trusted Publisher for each (npmjs.com → package →
# Settings → GitHub Actions: owner Kanzo-Tech, repo ui, workflow release.yml —
# THIS file, not whichever one published before), then delete NODE_AUTH_TOKEN
# below. `id-token: write` is already here for that day, and it is what earns the
# SLSA provenance a token publish does not get.

on:
  push:
    tags:
      - "v*"

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Publish @kanzo-tech/*
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      # No `version:` here on purpose. `packageManager: pnpm@9.0.0` in the root
      # package.json is the single source, and declaring it in both makes the
      # action refuse to run: `Multiple versions of pnpm specified`.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: "https://registry.npmjs.org"
      # npm >= 11.5.1 for Trusted Publishing, for when auth moves to OIDC.
      - name: Upgrade npm
        run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile

      # The tag carries the version. A prerelease identifier becomes the dist-tag,
      # so `v0.2.0-alpha.1` lands on `alpha` and leaves `latest` where it was.
      # NOTE: npm points `latest` at the FIRST version a package ever publishes,
      # whatever --tag says — there is nothing else for it to point at. That is
      # only ever true once per package.
      - name: Resolve version and dist-tag
        id: ver
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          case "$version" in
            *-*) tag="${version#*-}"; tag="${tag%%.*}" ;;
            *)   tag="latest" ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publishing $version under dist-tag $tag"

      # The committed versions are placeholders; the tag is the statement.
      - name: Stamp the version on all four packages
        run: |
          set -euo pipefail
          for pkg in theme ui graph ai; do
            (cd "packages/$pkg" && npm pkg set version="${{ steps.ver.outputs.version }}")
          done

      # npm versions are immutable after 72 hours, so a red build must never reach
      # the registry. The gate runs AFTER the stamp, so what is checked is what
      # ships — `smoke` packs the real tarballs and installs them, and it is the
      # only check here that sees the workspace: rewrite at all.
      - run: pnpm -r --filter "./packages/*" build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm check:generated
      - run: pnpm test
      - run: pnpm size
      - run: pnpm smoke

      # `pnpm publish`, never `npm publish`: only pnpm rewrites `workspace:*` into
      # a real range, and -r publishes in dependency order so theme precedes ui.
      # --no-git-checks because the stamp above leaves the tree dirty by design.
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          pnpm -r --filter "./packages/*" publish \
            --access public --tag "${{ steps.ver.outputs.tag }}" --no-git-checks
