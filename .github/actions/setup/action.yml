name: Setup
description: pnpm, Node and an installed workspace — the four lines every job here began with.

# Every workflow opened with the same four steps and the same paragraph explaining
# the third one. Four copies of one fact is four things to keep in step, and they
# had already drifted: two workflows pinned Node 20 and one pinned 24.
#
# Checkout stays in the job. A composite action cannot see the repository before
# it is cloned, and hiding the clone would make `fetch-depth`/`ref` unreachable
# where a job needs them.

inputs:
  registry-url:
    description: >-
      npm registry to authenticate against. Pass it ONLY where the job publishes.
      `setup-node` writes ~/.npmrc with the literal line
      `//<registry>/:_authToken=${NODE_AUTH_TOKEN}` and it writes it only when this
      is set — so without it the publish step's token is read by nobody and auth
      fails with no missing-secret to point at. That is also why the env var is
      NODE_AUTH_TOKEN and not NPM_TOKEN: the secret is named NPM_TOKEN, but the
      name npmrc expands is fixed by setup-node.
    required: false
    default: ""

runs:
  using: composite
  steps:
    # No `version:` here on purpose. `packageManager: pnpm@9.0.0` in the root
    # package.json is the single source, and declaring it in both makes the action
    # refuse to run: `Multiple versions of pnpm specified`. One spelling of one fact.
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: pnpm
        registry-url: ${{ inputs.registry-url }}
    - run: pnpm install --frozen-lockfile
      shell: bash
